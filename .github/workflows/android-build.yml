name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # نسخهٔ ۱.۱۱.۳۲ (بازرسی امنیتی): کیستور امضا دیگر نباید داخل مخزن عمومی باشد.
      # تا وقتی Secret «KEYSTORE_JKS_B64» تعریف نشده، از فایل موقت داخل مخزن استفاده
      # می‌شود تا CI نشکند؛ پس از تعریف Secret، فایل از مخزن حذف خواهد شد.
      - name: Restore signing keystore from Secret (یا فایل موقت)
        env:
          KEYSTORE_JKS_B64: ${{ secrets.KEYSTORE_JKS_B64 }}
        run: |
          if [ -n "$KEYSTORE_JKS_B64" ]; then
            echo "$KEYSTORE_JKS_B64" | base64 -d > signing/badkhan-release.jks
            echo "کیستور از Secret بازگردانی شد"
          else
            echo "⚠ Secret KEYSTORE_JKS_B64 تعریف نشده — استفاده از فایل داخل مخزن (موقت)"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      # نسخهٔ ۱.۱۱.۳۱ — پایهٔ اعتماد: تست‌های خودکار تبدیل تاریخ پیش از هر ساخت.
      # با شکست هر تست، APK ساخته و منتشر نمی‌شود.
      - name: Run unit tests (تبدیل تاریخ — پایهٔ اعتماد)
        run: |
          chmod +x gradlew
          ./gradlew :app:testPublicReleaseUnitTest --stacktrace

      - name: Upload test report (فقط هنگام شکست)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # نسخهٔ ۱.۱۱.۳۰ — دو فلاور:
      #   public : نسخهٔ کاربران (بدون پنل مدیریت/توکن/رمز) → Release عمومی
      #   admin  : نسخهٔ شخصی مدیر (پنل کامل) → فقط artifact خصوصی گیت‌هاب
      - name: Build release APKs (امضای ثابت — قابل به‌روزرسانی روی نسخهٔ قبلی)
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assemblePublicRelease :app:assembleAdminRelease --stacktrace

      - name: Upload public APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersianCalendar-public-apk
          path: app/build/outputs/apk/public/release/*.apk
          if-no-files-found: error

      - name: Upload admin APK artifact (فقط برای مدیر — وارد Release نمی‌شود)
        uses: actions/upload-artifact@v4
        with:
          name: PersianCalendar-admin-apk
          path: app/build/outputs/apk/admin/release/*.apk
          if-no-files-found: error

  release:
    name: Attach APK to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # نسخهٔ ۱.۱۱.۳۰: به Release فقط APK نسخهٔ public (کاربران) پیوست می‌شود
      - name: Download public APK
        uses: actions/download-artifact@v4
        with:
          name: PersianCalendar-public-apk
          path: apk

      - name: Rename APK nicely
        run: |
          mkdir -p out
          mv apk/*.apk "out/PersianCalendar-${GITHUB_REF_NAME}-install.apk"
          ls -la out

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          fail_on_unmatched_files: true
