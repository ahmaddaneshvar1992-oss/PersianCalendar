name: Sign feed files (Ed25519)

# نسخهٔ ۱.۱۱.۳۰ — امضای خودکار خوراک‌ها (بازرسی امنیتی: «فید بدون امضاست»)
# هر وقت یکی از فایل‌های خوراک عوض شود (انتشار از پنل مدیر، ویرایش وب گیت‌هاب،
# یا کامیت از رایانه) این وورکفلو امضای Ed25519 تازه می‌سازد و کنار فایل می‌گذارد.
# کلید خصوصی در Secret مخزن (FEED_SIGNING_KEY) است — هرگز در اپ یا در کد نیست.
# اپ فقط با کلید عمومیِ داخل خودش امضا را تأیید می‌کند.

on:
  push:
    paths:
      - 'feed/announcements.json'
      - 'feed/main_ads.json'
      - 'feed/config.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sign-feed
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptography
        run: pip install cryptography

      # نسخهٔ ۱.۱۱.۳۵ — اعتبارسنجی فید تبلیغات پیش از امضا (tools/ads_feed.py):
      # schema، فقط https، تاریخ‌ها و لیست‌سفید داخلی؛ خرابی = قرمز شدن push
      - name: Validate ads feed (اعتبارسنجی فید تبلیغات)
        run: python3 tools/ads_feed.py --validate

      - name: Sign feed files (امضای Ed25519 روی بایت‌های دقیق)
        env:
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: python scripts/sign_feed.py

      # نسخهٔ ۱.۱۱.۳۵ — راستی‌آزمایی امضای تازه با کلیدهای عمومی داخل اپ:
      # اگر Secret با هیچ‌کدام از کلیدهای سنجاق‌شده جور نباشد، امضا commit
      # نمی‌شود و این مرحله با پیام روشن قرمز می‌شود (تا تکرار «فید امضادار
      # ولی بی‌اعتبار» که اطلاعیه/تبلیغ را به کاربران نمی‌رساند پیش نیاید).
      - name: Verify signatures against app pinned keys
        run: |
          python3 - <<'PY'
          import base64, sys
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          PINS = [
              "lpVtz80eClDZSxdm+GmxmBXuu3VN7ObOvjuTpQiQ6HI=",  # FeedSecurity.PUBLIC_KEY_B64
              "Z5mIWsYEhgULQ6B3tGimJkkQCUNPN0ipslFBY8uArPw=",  # FeedSecurity.PUBLIC_KEY_B64_ROTATED
          ]
          pubs = [Ed25519PublicKey.from_public_bytes(base64.b64decode(p)) for p in PINS]

          def ok(pub, sig_bytes, data):
              try:
                  pub.verify(sig_bytes, data)
                  return True
              except Exception:
                  return False

          bad = []
          for jf in sorted(Path("feed").glob("*.json")):
              sig = Path(str(jf) + ".sig")
              if not sig.exists():
                  bad.append(jf.name + " (بدون .sig)")
                  continue
              s = base64.b64decode(sig.read_bytes())
              if not any(ok(p, s, jf.read_bytes()) for p in pubs):
                  bad.append(jf.name)
          if bad:
              print("⚠⚠ امضای تازه با هیچ‌کدام از کلیدهای عمومی داخل اپ تأیید نمی‌شود:", bad)
              print("Secret «FEED_SIGNING_KEY» باید Base64 seed کلیدی باشد که کلید عمومی‌اش در FeedSecurity.kt هست.")
              print("راهنما: tools/README-FA.md (بخش چرخش کلید). این امضا commit نمی‌شود.")
              sys.exit(1)
          print("همهٔ امضاها با کلیدهای داخل اپ تأیید شدند ✓")
          PY

      - name: Commit signatures
        run: |
          git config user.name "feed-signer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/*.sig
          if git diff --cached --quiet; then
            echo "امضاها تغییری نکرده‌اند — کاری لازم نیست"
            exit 0
          fi
          git commit -m "امضای Ed25519 خوراک (خودکار) [skip ci]"
          git push
